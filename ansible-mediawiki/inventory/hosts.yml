---
all:
  vars:
    # SSH account and private key on the Ansible control machine.
    ansible_user: ubuntu
    ansible_ssh_private_key_file: "~/.ssh/id_ed25519"

    # Run administrative tasks with sudo on managed hosts.
    ansible_become: true
    ansible_become_user: root
    ansible_become_method: sudo

  children:
    # Bastion is reached directly from the Ansible control machine.
    # It is intentionally NOT a member of private_servers.
    proxy_server:
      hosts:
        vm_proxy_bastion:
          ansible_host: "CHANGE_ME_PUBLIC_BASTION_IP"
          ansible_ssh_common_args: >-
            -o StrictHostKeyChecking=accept-new

    # This extra parent group applies ProxyJump to all private VMs.
    # Original infrastructure group names are retained below.
    private_servers:
      vars:
        ansible_ssh_common_args: >-
          -o ProxyJump=ubuntu@{{ hostvars['vm_proxy_bastion']['ansible_host'] }}
          -o StrictHostKeyChecking=accept-new

      children:
        # Original group: balancer
        balancer:
          hosts:
            vm_balancer:
              ansible_host: 192.168.10.50

        # Original group: web_servers
        web_servers:
          hosts:
            vm_1:
              ansible_host: 192.168.10.2
            vm_2:
              ansible_host: 192.168.10.3

        # Original group: data
        data:
          children:
            # Original group: sql_cluster.
            # Primary/standby are child groups used by the DB playbooks.
            sql_cluster:
              children:
                postgres_primary:
                  hosts:
                    sql_1:
                      ansible_host: 192.168.10.18
                postgres_standby:
                  hosts:
                    sql_2:
                      ansible_host: 192.168.10.19

            # Original group: backup
            backup:
              hosts:
                storage_backups:
                  ansible_host: 192.168.10.20

            # Original group: network_storage
            network_storage:
              hosts:
                nfs:
                  ansible_host: 192.168.10.21

        # Original group: zabbix
        zabbix:
          hosts:
            vm_zabbix:
              ansible_host: 192.168.10.34
