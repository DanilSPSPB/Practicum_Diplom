---
web_nginx_package: nginx
nginx_web_site_path: /etc/nginx/sites-available/mediawiki
nginx_web_enabled_path: /etc/nginx/sites-enabled/mediawiki
nginx_web_listen_port: "{{ web_nginx_port }}"
nginx_web_client_max_body_size: 50m

# Match the PHP-FPM socket in the web Nginx configuration.
# Change this if the target distribution provides another PHP version.
php_version: "8.5"
php_fpm_service: "php{{ php_version }}-fpm"
php_fpm_socket: "/run/php/php{{ php_version }}-fpm.sock"
php_fpm_ini_dir: "/etc/php/{{ php_version }}/fpm/conf.d"
php_packages:
  - "php{{ php_version }}-fpm"
  - "php{{ php_version }}-cli"
  - "php{{ php_version }}-pgsql"
  - "php{{ php_version }}-xml"
  - "php{{ php_version }}-mbstring"
  - "php{{ php_version }}-intl"
  - "php{{ php_version }}-curl"
  - "php{{ php_version }}-gd"
  - "php{{ php_version }}-zip"
  - "php{{ php_version }}-apcu"

php_ini_upload_max_filesize: 50M
php_ini_post_max_size: 50M
php_ini_memory_limit: 256M
php_ini_max_execution_time: 300
php_ini_max_input_time: 300
